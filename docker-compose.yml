services:
  parsedmarc-init:
    image: ghcr.io/nachotek/parsedmarc-init:latest
    restart: always
    volumes:
      - parsedmarc_conf:/etc/parsedmarc/:rw
      - elasticsearch_data:/usr/share/elasticsearch/data/:rw
      - grafana_data:/var/lib/grafana/:rw
    networks:
      - parsedmarc-network
    healthcheck:
      test: [ "CMD", "test", "-f", "/ready" ]
      interval: 10s
      timeout: 5s
      retries: 9999
      start_period: 10s

  parsedmarc:
    image: patschi/parsedmarc:latest
    volumes:
      - parsedmarc_conf:/etc/parsedmarc/
      - geoip_data:/usr/share/GeoIP:ro
    restart: always
    networks:
      - parsedmarc-network
    depends_on:
      elasticsearch:
        condition: service_healthy

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    environment:
      - cluster.name=parsedmarc
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms2g -Xmx2g"
      - xpack.security.enabled=false
      - xpack.security.http.ssl.enabled=false
      - xpack.security.transport.ssl.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    volumes:
      - elasticsearch_data:/usr/share/elasticsearch/data/
    restart: always
    networks:
      - parsedmarc-network
    expose: # only expose docker-internally
      - 9200
    healthcheck:
      test: [ "CMD", "curl","-s" ,"-f", "http://localhost:9200/_cat/health" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      parsedmarc-init:
        condition: service_started

  grafana:
    image: grafana/grafana:latest
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=${GRAFANA_ROOT_URL:-http://localhost:3000}
      - GF_PLUGINS_PREINSTALL_SYNC=elasticsearch
    volumes:
      - grafana_data:/var/lib/grafana
      - ./data/conf/grafana/provisioning:/etc/grafana/provisioning:ro
      - parsedmarc_conf:/etc/parsedmarc:ro
    restart: always
    networks:
      - parsedmarc-network
    ports:
      - "${GRAFANA_PORT_BINDING:-3000:3000}"
    depends_on:
      elasticsearch:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-s", "-f", "http://localhost:3000/api/health" ]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

  geoipupdate:
    image: maxmindinc/geoipupdate
    env_file:
      - geoipupdate.env
    environment:
      - "GEOIPUPDATE_EDITION_IDS=GeoLite2-Country"
      - GEOIPUPDATE_PRESERVE_FILE_TIMES=1
    restart: always
    volumes:
      - geoip_data:/usr/share/GeoIP/:rw

networks:
  parsedmarc-network:
    driver: bridge

volumes:
  parsedmarc_conf:
  elasticsearch_data:
  grafana_data:
  geoip_data:
